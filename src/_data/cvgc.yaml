strengths:
  - area: Research leadership
    items: Designing and leading research programs, competitive funding, lead-authored papers, ocean and ecosystem model development, field and at-sea research
  - area: Science management
    items: Budgets, staffing, performance management, field and at-sea programs, research planning aligned with departmental priorities
  - area: Science advice
    items: Briefings for senior management, CSAS peer review (steering committee, subject-matter expert), parliamentary testimony
  - area: Partnerships
    items: First Nations, Province of BC, ECCC, Parks Canada, universities, industry and stakeholders
  - area: Technical depth
    items: Ecosystem and ocean modelling, GIS and spatial analysis, Python, R, HPC, marine spatial and conservation planning

results:
  - Recommended the Aquaculture Monitoring Program trial low-cost eDNA sampling of benthic communities under finfish farms; the advice secured budget and a pilot field season (July–September 2026).
  - Kept the Nearshore Ecosystems Section on track during budget cuts in 2026, completing the research cruise and field season, hiring co-op students and developing a new research program.
  - Won Competitive Science Research Fund support to start the Integrated Ecosystem Modelling program; hired and supervised a scientist and delivered the final report in 2025.
  - Led HOTSSea, a 40-year Salish Sea ocean hindcast, to publication (Geoscientific Model Development, 2025) after earlier attempts had stalled; it underpins the Strait of Georgia ecosystem model.
  - Co-led federal technical analyses, as co-chair of an intergovernmental technical working group, that informed the Great Bear Sea MPA network (endorsed 2023); team received the DFO Prix d'Excellence.
  - Expert witness to the House of Commons Fisheries Committee (2022); testimony fed into its 2023 report "Science at the Department of Fisheries and Oceans".
  - Hosted briefings and site tours of the Pacific Science Enterprise Centre for the Minister, Deputy Minister, ADM and Director General.

