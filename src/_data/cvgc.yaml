headline: Science Manager · Research Lead · Science Advisor

contact:
  email: greig.oldford@dfo-mpo.gc.ca
  location: Vancouver, BC · open to relocation

profile: >-
  Versatile science leader with 13+ years at Fisheries and Oceans Canada in research,
  science management and advice, across both the Science and Ecosystem Management branches.
  I currently manage a section of research scientists and field and laboratory biologists.
  I have designed and led a funded ecosystem modelling program, led a 40-year Salish Sea
  ocean hindcast to publication, coordinated intergovernmental technical work for the Great
  Bear Sea MPA network with First Nations and the Province of BC, and given expert testimony
  to Parliament. I move easily between research, field programs, planning, policy and people
  management, and turn complex science into clear options for decision-makers.

