headline: Science Manager · Science Advisor · Ecosystem Scientist

contact:
  email: greig.oldford@dfo-mpo.gc.ca
  location: Vancouver, BC · open to relocation

profile: >-
  Versatile science leader with 13+ years at Fisheries and Oceans Canada across both the
  Science and Ecosystem Management branches. I currently manage a section of research
  scientists and field and laboratory biologists. Before that I designed and led a new
  ecosystem modelling program, coordinated intergovernmental technical work for the Great
  Bear Sea MPA network with First Nations and the Province of BC, and gave expert testimony
  to the House of Commons Fisheries Committee. I move easily between field programs,
  quantitative science, marine planning, policy and people management, and I turn complex
  science into clear options for senior management, partners and the public.

