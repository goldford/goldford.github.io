strengths:
  - area: Science management
    items: Budgets and financial management, staffing, performance management, field and at-sea programs, research planning aligned with departmental priorities
  - area: Science advice
    items: Briefing notes and decks for senior management, CSAS peer review (steering committee and subject-matter expert), parliamentary testimony
  - area: Partnerships
    items: First Nations, Province of BC, ECCC, Parks Canada, universities, industry and stakeholders
  - area: Technical depth
    items: Ecosystem and ocean modelling, GIS and spatial analysis, data science (Python, R, HPC), marine spatial and conservation planning

results:
  - Recommended the Aquaculture Monitoring Program trial low-cost eDNA sampling of benthic communities under finfish farms; the advice to the Director and National Capital Region management secured the budget and a pilot field season (July–September 2026).
  - Kept the Nearshore Ecosystems Section on track during budget cuts in 2026, completing the research cruise and field season, hiring co-op students and developing a new research program.
  - Won Competitive Science Research Fund support to start the Integrated Ecosystem Modelling program; hired and supervised a scientist and delivered the final report in 2025.
  - Co-chaired the intergovernmental Tech-Data Subgroup whose gap analyses informed the Great Bear Sea MPA network (endorsed 2023); team received the DFO Prix d'Excellence.
  - Gave expert testimony to the House of Commons Standing Committee on Fisheries and Oceans (2022), which fed into its 2023 report "Science at the Department of Fisheries and Oceans" (48 recommendations to the Minister).
  - Hosted briefings and site tours of the Pacific Science Enterprise Centre for the Minister, Deputy Minister, Assistant Deputy Minister and Director General.

