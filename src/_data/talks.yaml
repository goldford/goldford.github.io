# Talks, panels, testimony and guest lectures. Any order (pages sort newest first).
# type: panel | testimony | invited | conference | seminar | workshop | poster | lecture
#   lecture = guest lecture in a course; these appear on /teaching/ rather than /talks/.
# highlight: true puts it in "On the record" on the home and talks pages.
# approx: true when only the month is known (shows month, not day).

- date: 2026-06-10
  type: invited
  highlight: true
  title: What can ocean-ecosystem simulations tell us about long-term environmental change in the Strait of Georgia?
  venue: Sunshine Coast Ocean Festival (public talk)
  location: Sechelt, BC
  abstract: A public talk on why coho and Chinook survival fell in the early 1980s, and how a reconstructed ocean history (HOTSSea) and ecosystem simulations help test what changed for young salmon in the Strait.

- date: 2026-05-05
  type: panel
  highlight: true
  title: "Science, power, and decision-making"
  role: Panellist
  venue: "Reimagining the Future of Oceans and Fisheries: UBC Institute for the Oceans and Fisheries 10th Anniversary Symposium (moderator: Nathan Bennett, WWF)"
  location: Vancouver, BC
  url: https://oceans.ubc.ca/iof-10-year-anniversary-symposium/
  abstract: How knowledge reaches policy and management in oceans and fisheries. I spoke on integrative ecosystem science since Holling and Walters, the data-synthesis gap that has slowed ecosystem-based management, and how AI tools are now closing it.

